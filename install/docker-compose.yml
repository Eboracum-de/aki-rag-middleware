services:
  proxy:
    image: ${NGINX_IMAGE:-nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/generated.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro,z
      - ./nginx/tls:/etc/nginx/tls:ro,z

  qdrant:
    profiles: ["qdrant"]
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    profiles: ["neo4j"]
    image: ${NEO4J_IMAGE:-neo4j:5.26.29-community@sha256:d9dd3dc7d1c78fa959191ff02dbdcbefadceaf83eee23428fb92a58cac8ad3fe}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in install/.env}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  openwebui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228}
    restart: unless-stopped
    profiles: ["ui"]
    # The bundled UI uses host networking deliberately. It binds only to
    # 127.0.0.1:3000 and reaches the provider on 127.0.0.1:8766 directly.
    # This keeps the internal frontend->provider hop off the external nginx
    # HTTP->HTTPS redirect and independent of the site's TLS certificate.
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "${OPENWEBUI_PORT:-3000}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_FORWARD_USER_INFO_HEADERS: "false"
      # RAG/provider connection is admin-owned. Disable OpenWebUI ConfigVar
      # persistence so stale DB values cannot override installer-managed URLs/keys.
      ENABLE_PERSISTENT_CONFIG: "false"
      # Nextcloud ACL is the authoritative document permission layer; do not
      # require a second per-model ACL inside the optional frontend.
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      OPENAI_API_BASE_URL: "http://127.0.0.1:8766/v1"
      OPENAI_API_KEY: "${OPENWEBUI_PROVIDER_API_KEY:-}"
      # Per-connection identity assertion. OpenWebUI expands {{USER_ID}} for
      # the signed-in user before calling our OpenAI-compatible provider.
      OPENAI_API_CONFIGS: '{"0":{"enable":true,"headers":{"X-OpenWebUI-User-Id":"{{USER_ID}}"}}}'
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  openwebui_data:

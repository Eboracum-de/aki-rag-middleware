worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Trust X-Forwarded-For only from a same-host front proxy (for example the
  # documented Apache path proxy). Remote load balancers must add their exact
  # addresses with additional set_real_ip_from directives; never trust arbitrary
  # forwarded-address headers from direct clients.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=rag_general:10m rate=15r/s;
  limit_req_zone $binary_remote_addr zone=rag_v1:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=rag_v1_conn:10m;
  limit_req_zone $binary_remote_addr zone=rag_auth_start:10m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=rag_auth_poll:10m rate=2r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Port 80 is intentionally redirect-only. The default external entry point is HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    client_max_body_size 100m;

    # A self-signed bootstrap certificate is generated by install.sh.
    # Administrators can replace server.crt/server.key with their site certificate.
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RAGTLS:10m;
    ssl_session_timeout 10m;

    # Proxy health is deliberately backend-independent so status.sh can
    # distinguish nginx from an optional/stopped UI.
    location = /proxy-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /rag-admin {
      return 302 /rag-admin/;
    }

    location /rag-admin/ {
      limit_req zone=rag_general burst=20 nodelay;
      auth_basic "RAG Admin";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_intercept_errors on;
      error_page 502 504 = /rag-admin-unavailable;
      proxy_pass http://127.0.0.1:8765;
    }

    # During maintenance the API is deliberately stopped. Keep the isolation
    # boundary intact, but return a meaningful response instead of nginx 502.
    location = /rag-admin-unavailable {
      internal;
      default_type text/html;
      return 503 "<!doctype html><html><head><meta charset='utf-8'><title>AKI Maintenance</title></head><body><h1>RAG-Admin derzeit nicht verfügbar</h1><p>Im Maintenance-Modus ist die Admin-API absichtlich gestoppt. Maintenance beenden und danach diese Seite neu laden.</p></body></html>";
    }

    # Keep the historic admin /health link useful behind the proxy.
    location = /health {
      include /etc/nginx/internal-auth.conf;
      limit_req zone=rag_general burst=20 nodelay;
      auth_basic "RAG Admin";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8765/health;
    }

    location = /auth/nextcloud/start {
      include /etc/nginx/internal-auth.conf;
      limit_req zone=rag_auth_start burst=3 nodelay;
      auth_basic "RAG Access";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8765;
    }

    location ~ ^/auth/nextcloud/status/ {
      include /etc/nginx/internal-auth.conf;
      limit_req zone=rag_auth_poll burst=10 nodelay;
      auth_basic "RAG Access";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8765;
    }

    location /auth/nextcloud/ {
      include /etc/nginx/internal-auth.conf;
      limit_req zone=rag_general burst=10 nodelay;
      auth_basic "RAG Access";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8765;
    }

    # End-user Findings curation has its own short-lived Nextcloud
    # authentication/session model. Do not put RAG-Admin Basic Auth in front of it.
    location = /curation {
      return 302 /curation/;
    }

    location /curation/ {
      limit_req zone=rag_general burst=20 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_pass http://127.0.0.1:8765;
    }

    # Human-friendly API root: land on the protected health endpoint instead
    # of returning FastAPI's 404 for the application root.
    location = /rag-api {
      return 302 /rag-api/health;
    }

    location = /rag-api/ {
      return 302 /rag-api/health;
    }

    location /rag-api/ {
      include /etc/nginx/internal-auth.conf;
      limit_req zone=rag_general burst=20 nodelay;
      auth_basic "RAG Admin";
      auth_basic_user_file /etc/nginx/htpasswd;
      rewrite ^/rag-api/(.*)$ /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-RAG-User-ID $http_x_rag_user_id;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://127.0.0.1:8765;
    }

    # OpenAI-compatible provider. It has its own Bearer API key; do not layer
    # HTTP Basic here because Authorization can carry only one scheme.
    location /v1/ {
      # Provider API keys are high-entropy credentials; protect the public
      # authentication surface with bounded request and connection pressure
      # rather than account lockouts that an attacker could abuse as a DoS.
      limit_req zone=rag_v1 burst=30 nodelay;
      limit_req_status 429;
      limit_conn rag_v1_conn 16;
      limit_conn_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://127.0.0.1:8766;
    }

    # `/` is reserved for the selected user UI. Without a UI installed,
    # redirect to the protected middleware admin area instead of publishing a
    # separate unauthenticated landing page.
    location = / {
      return 302 /rag-admin/;
    }

    location / {
      return 404;
    }
  }
}

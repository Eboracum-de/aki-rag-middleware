name: Bug report
description: Report a reproducible problem in AKI RAG Middleware
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include credentials, private document contents, customer data, private keys or unredacted runtime databases/logs.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.8.5-rc3 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Functional profile
      options:
        - super-light
        - standard
        - other / unsure
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - dockerized
        - native
        - other / unsure
    validations:
      required: true
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud version
  - type: input
    id: platform
    attributes:
      label: Host OS / container runtime
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Redact secrets, private content and internal data before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I have removed credentials, private keys and private document/customer data.
          required: true

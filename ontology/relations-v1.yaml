version: 1
name: nextcloud-rag-relations-v1

# Controlled relation vocabulary. This is deliberately separate from config.yaml:
# it is part of the graph semantics, not runtime tuning.
predicates:
  BOARD_MEMBER_OF:
    description: Person is a member of the executive/management board of an organization.
    subject_types: [Person]
    object_types: [Organization]
    relation_cues_any: ["vorstand", "vorstandsmitglied", "mitglied des vorstands"]

  SUPERVISORY_BOARD_CHAIR_OF:
    description: Person is chair of the supervisory board of an organization.
    subject_types: [Person]
    object_types: [Organization]
    relation_cues_any: ["vorsitzender des aufsichtsrats", "vorsitzende des aufsichtsrats", "aufsichtsratsvorsitzender", "aufsichtsratsvorsitzende"]

  DIRECTOR_OF:
    description: Person is managing director / Geschaeftsfuehrer of an organization.
    subject_types: [Person]
    object_types: [Organization]
    relation_cues_any: ["geschäftsführer", "geschaeftsfuehrer", "geschäftsführerin", "geschaeftsfuehrerin", "managing director"]

  WORKS_AT:
    description: Person works for or is employed by an organization.
    subject_types: [Person]
    object_types: [Organization]
    sources: [seed, document]
    roles: [structural, retrieval_bridge, identity_context, identity_merge, person_affiliation]
    relation_cues_any: ["arbeitet bei", "beschäftigt bei", "beschaeftigt bei", "angestellt bei", "mitarbeiter", "mitarbeiterin"]

  WORKS_IN:
    description: Person is assigned to an organizational unit within an organization.
    subject_types: [Person]
    object_types: [Organization]
    sources: [seed]
    roles: [structural, retrieval_bridge, identity_context, identity_merge, person_affiliation]
    relation_cues_any: ["arbeitet in", "abteilung", "bereich", "team", "niederlassung"]

  SHAREHOLDER_OF:
    description: Person or organization is a shareholder/member holding an interest in an organization.
    subject_types: [Person, Organization]
    object_types: [Organization]
    relation_cues_any: ["gesellschafter", "gesellschafterin", "anteil", "beteiligung", "geschäftsanteil", "geschaeftsanteil"]

  OWNS:
    description: Person or organization owns the other organization.
    subject_types: [Person, Organization]
    object_types: [Organization]
    relation_cues_any: ["eigentümer", "eigentümerin", "eigentuemer", "eigentuemerin", "im eigentum", "gehört", "gehoert"]

  REPRESENTS:
    description: Person or organization legally or professionally represents another person or organization.
    subject_types: [Person, Organization]
    object_types: [Person, Organization]
    relation_cues_any: ["vertreten durch", "vertritt", "bevollmächtigt", "bevollmaechtigt", "prozessbevollmächtigt", "prozessbevollmaechtigt"]

  CONTRACTS_WITH:
    description: Two persons/organizations are explicitly identified as contractual parties to the same contract.
    subject_types: [Person, Organization]
    object_types: [Person, Organization]
    relation_cues_any: ["vertragspartner", "vertrag zwischen", "vereinbarung zwischen", "kaufvertrag zwischen", "mietvertrag zwischen"]

  PART_OF:
    description: An organization or organizational unit is explicitly part of another organization.
    subject_types: [Organization]
    object_types: [Organization]
    sources: [seed, document]
    roles: [structural, retrieval_bridge, identity_context, identity_merge]
    relation_cues_any: ["teil von", "gehört zu", "gehoert zu", "abteilung", "niederlassung", "geschäftsbereich", "geschaeftsbereich"]

  REGISTERED_AT:
    description: An organization is registered in a register maintained by a named court/register authority.
    subject_types: [Organization]
    object_types: [Organization]
    object_kinds: [Court]
    relation_cues_any: ["amtsgericht", "registergericht", "handelsregister", "vereinsregister", "genossenschaftsregister", "partnerschaftsregister"]
